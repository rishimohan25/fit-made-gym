services:
  app:
    build: .
    container_name: gym_training_app
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-gym_production_secret_key_change_me_987}
      - DATABASE_URL=${DATABASE_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: gym_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
